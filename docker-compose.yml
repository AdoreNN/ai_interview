services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - grillo

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-grillo}
      POSTGRES_USER: ${POSTGRES_USER:-grillo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-grillo}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-grillo} -d ${POSTGRES_DB:-grillo}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks:
      - grillo

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-grillo}:${POSTGRES_PASSWORD:-grillo}@db:5432/${POSTGRES_DB:-grillo}
      JWT_SECRET: ${JWT_SECRET:-development-only-secret-change-me-123456789}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      RESUME_PARSER_URL: http://resume-parser:8000
      MAX_RESUME_BYTES: ${MAX_RESUME_BYTES:-5000000}
      INTERVIEW_HR_QUESTIONS: ${INTERVIEW_HR_QUESTIONS:-2}
      INTERVIEW_TECH_QUESTIONS: ${INTERVIEW_TECH_QUESTIONS:-3}
      INTERVIEW_MANAGER_QUESTIONS: ${INTERVIEW_MANAGER_QUESTIONS:-2}
      LLM_MODE: ${LLM_MODE:-stub}
      GIGACHAT_CREDENTIALS: ${GIGACHAT_CREDENTIALS:-}
      GIGACHAT_SCOPE: ${GIGACHAT_SCOPE:-GIGACHAT_API_PERS}
      GIGACHAT_MODEL: ${GIGACHAT_MODEL:-GigaChat-2-Pro}
      GIGACHAT_VERIFY_SSL: ${GIGACHAT_VERIFY_SSL:-false}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      resume-parser:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped
    networks:
      - grillo

  resume-parser:
    build:
      context: .
      dockerfile: pdf_parser_agent/Dockerfile
    environment:
      LLM_MODE: ${LLM_MODE:-stub}
      GIGACHAT_CREDENTIALS: ${GIGACHAT_CREDENTIALS:-}
      GIGACHAT_SCOPE: ${GIGACHAT_SCOPE:-GIGACHAT_API_PERS}
      GIGACHAT_MODEL: ${GIGACHAT_MODEL:-GigaChat-2-Pro}
      GIGACHAT_VERIFY_SSL: ${GIGACHAT_VERIFY_SSL:-false}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      MAX_RESUME_CHARS: ${MAX_RESUME_CHARS:-12000}
      MAX_RESUME_BYTES: ${MAX_RESUME_BYTES:-5000000}
      MAX_QUESTIONS: ${MAX_QUESTIONS:-8}
    ports:
      - "${RESUME_PARSER_PORT:-8001}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped
    networks:
      - grillo

volumes:
  postgres_data:

networks:
  grillo:
    driver: bridge
